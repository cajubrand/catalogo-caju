<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caju | Catálogo de Semijoias</title>
<meta name="description" content="Catálogo Caju: semijoias VERI by Veridiana Quirino. Peças únicas, peça a sua pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Caju | Catálogo de Semijoias">
<meta property="og:description" content="Semijoias VERI by Veridiana Quirino. Peças únicas, peça a sua pelo WhatsApp.">
<meta property="og:image" content="https://cajubrand.github.io/catalogo-caju/og-image.jpg">
<meta property="og:image:width" content="1200">

<meta property="og:url" content="https://cajubrand.github.io/catalogo-caju/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#FBF5EA; --magenta:#C2457A; --bordo:#7A1F33; --noite:#1F2A4D;
    --petala:#5468B0; --mostarda:#E2B13C; --salvia:#7A9473;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--creme);color:var(--noite);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{text-align:center;padding:36px 20px 18px}
  .logo{font-family:'Caveat Brush',cursive;font-size:64px;line-height:1;color:var(--bordo)}
  .sub{margin-top:6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--noite);opacity:.75}
  .mes{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:999px;background:var(--noite);color:var(--creme);font-size:13px;font-weight:500}
  .aviso{max-width:560px;margin:14px auto 0;font-size:13px;line-height:1.45;opacity:.75}
  nav{position:sticky;top:0;z-index:5;background:var(--creme);padding:10px 14px;display:flex;gap:8px;overflow-x:auto;justify-content:center;border-bottom:1px solid rgba(31,42,77,.08)}
  nav button{flex:none;font:500 14px 'DM Sans',sans-serif;padding:8px 16px;border-radius:999px;border:1.5px solid var(--noite);background:transparent;color:var(--noite);cursor:pointer}
  nav button.on{background:var(--noite);color:var(--creme)}
  main{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
  section{margin-bottom:34px}
  h2{font-family:'Caveat Brush',cursive;font-weight:400;font-size:36px;margin:6px 4px 14px;display:flex;align-items:center;gap:10px}
  h2 .dot{width:14px;height:14px;border-radius:50%}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(31,42,77,.06),0 6px 18px rgba(31,42,77,.06)}
  .foto{position:relative;aspect-ratio:1/1;background:#f1ebe0}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .cod{position:absolute;top:10px;left:10px;background:var(--creme);color:var(--noite);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .nome{font-size:14px;line-height:1.3;font-weight:500}
  .ref{font-size:11px;letter-spacing:.06em;opacity:.55}
  .obs{font-size:12px;opacity:.65;line-height:1.3}
  .preco{font-size:18px;font-weight:700;margin-top:auto;padding-top:4px}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--magenta);color:#fff;font-weight:700;font-size:14px;padding:10px;border-radius:10px;margin-top:6px}
  .vendida .foto img{filter:grayscale(1);opacity:.45}
  .faixa{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-8deg);background:var(--bordo);color:var(--creme);text-align:center;font-weight:700;letter-spacing:.2em;padding:8px 0;font-size:15px}
  .vendida .preco{text-decoration:line-through;opacity:.45}
  .esgot{margin-top:6px;text-align:center;font-size:13px;font-weight:500;color:var(--bordo);padding:10px;border:1.5px dashed rgba(122,31,51,.4);border-radius:10px}
  footer{text-align:center;padding:26px 20px 40px;font-size:14px;line-height:1.6}
  footer .logo{font-size:38px}
  footer a{color:var(--magenta);font-weight:700}
  .foto img{cursor:zoom-in}
  #zoom{position:fixed;inset:0;z-index:50;background:rgba(31,42,77,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
  #zoom.on{display:flex}
  #zoom img{max-width:100%;max-height:78vh;border-radius:12px;background:#fff}
  #zoom .zt{color:#FBF5EA;margin-top:14px;text-align:center;font-size:15px;line-height:1.4}
  #zoom .zt b{display:block;font-size:17px}
  #zoom button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#FBF5EA;color:#1F2A4D;font-size:24px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">Caju</div>

  <div class="mes" id="mes"></div>
  <p class="aviso">Peças únicas: só uma de cada! Gostou? Toque em <b>Quero essa</b> e fale com a gente no WhatsApp. Fotos ilustrativas.<br>Banho de Ródio ou Ouro. Prata 925.</p>
</header>
<nav id="filtros"></nav>
<main id="lista"></main>
<div id="zoom" role="dialog" aria-modal="true"><button aria-label="Fechar">×</button><img alt=""><div class="zt"></div></div>
<footer>
  <div class="logo">Caju</div>
  WhatsApp: <a href="https://wa.me/5515996782804">(15) 99678-2804</a>
</footer>

  {cod:"BR5780", item:"5580541", tipo:"brincos", nome:"Brinco ponto de luz coração pequeno | dourado", preco:69.00, foto:"img/B05.jpg", vendida:false},
  {cod:"BR5276", item:"4847842", tipo:"brincos", nome:"Argola efeito orgânico | prateado", preco:99.00, foto:"img/B06.jpg", vendida:true},
  {cod:"BR6497", item:"6372350", tipo:"brincos", nome:"Duo brincos coração cravejado | dourado", preco:74.00, foto:"img/B07.jpg", vendida:false, obs:"Kit com 2 pares."},
  {cod:"BR3153", item:"5773209", tipo:"brincos", nome:"Trio corações | dourado", preco:69.00, foto:"img/B08.jpg", vendida:false, obs:"Kit com 3 pares."},
  {cod:"BR6176", item:"5935445", tipo:"brincos", nome:"Argola micro zircônia | prateado", preco:169.00, foto:"img/B09.jpg", vendida:false},
  {cod:"BR3550", item:"6086890", tipo:"brincos", nome:"Mini argola olho grego | prateado", preco:47.00, foto:"img/B10.jpg", vendida:false},
  {cod:"BR4991", item:"6369954", tipo:"brincos", nome:"Brinco coração assimétrico | dourado", preco:89.00, foto:"img/B11.jpg", vendida:false, obs:"Acompanha só o brinco de coração. O ear cuff não está incluso."},
  {cod:"BR103", item:"6067881", tipo:"brincos", nome:"Brinco mini pérola | dourado", preco:17.00, foto:"img/B12.jpg", vendida:false, obs:"Peça bem pequena e delicada."},

  {cod:"BR5794", item:"6217981", tipo:"kids", nome:"Brinco mini coração | dourado", preco:27.00, foto:"img/BR5794.jpg", vendida:false, obs:"Linha infantil. Peça bem pequena e delicada."},
  {cod:"BR6471", item:"6199705", tipo:"brincos", nome:"Ear cuff cravejado zircônia | dourado", preco:139.00, foto:"img/B16.jpg", vendida:false, obs:"Acompanha só o brinco cravejado (o da parte de baixo da orelha). O ear cuff liso de três linhas não está incluso."},
  {cod:"BR6501", item:"6351096", tipo:"brincos", nome:"Brinco flor esmaltada branca com pérola | dourado", preco:99.00, foto:"img/BR6501.jpg", vendida:false},
  {cod:"BR6356", item:"6216757", tipo:"brincos", nome:"Brinco argola pingente coração | dourado", preco:89.00, foto:"img/BR6356.jpg", vendida:false},
  {cod:"BR5848", item:"5917963", tipo:"brincos", nome:"Argola formato coração 0,7 cm | dourado", preco:59.00, foto:"img/BR5848.jpg", vendida:false},

  {cod:"CL1968", item:"5811159", tipo:"colares", nome:"Colar pérolas com medalha cravejada zircônia | dourado", preco:119.00, foto:"img/C04.jpg", vendida:false, obs:"Acompanha só o colar de pérolas com medalha. O aro dourado e o anel não estão inclusos."},

  {cod:"CL1485", item:"5780640", tipo:"colares", nome:"Colar trançado cordão baiano | prateado", preco:239.00, foto:"img/C11.jpg", vendida:false},
  {cod:"PL1664", item:"6373514", tipo:"pulseiras", nome:"Pulseira colorida | dourado", preco:59.00, foto:"img/P01.jpg", vendida:false},
  {cod:"PL1088", item:"5590573", tipo:"pulseiras", nome:"Pulseira snake grossa | prateada", preco:169.00, foto:"img/P02.jpg", vendida:false, obs:"Acompanha só a pulseira snake (a mais larga). A pulseira de elos não está inclusa."},
  {cod:"PL1135", item:"5999329", tipo:"pulseiras", nome:"Pulseira cordão baiano fina | prateada", preco:119.00, foto:"img/P03.jpg", vendida:false},
  {cod:"PL1490", item:"6336804", tipo:"pulseiras", nome:"Pulseira mini esferas | Prata 925", preco:99.00, foto:"img/P04.jpg", vendida:false},
  {cod:"PL920", item:"5758723", tipo:"pulseiras", nome:"Pulseira riviera fina zircônia | prateada", preco:119.00, foto:"img/P05.jpg", vendida:false},
];
/* ====================================== */

const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
document.getElementById("mes").textContent = MES;
let filtro = "todos";

function render(){
  const tiposComPeca = TIPOS.filter(t => PECAS.some(p => p.tipo===t.id));
  const nav = document.getElementById("filtros");
  nav.innerHTML = "";
  [{id:"todos",nome:"Todos"}, ...tiposComPeca].forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t.nome; if(t.id===filtro) b.className="on";
    b.onclick = ()=>{filtro=t.id; render(); window.scrollTo({top:0,behavior:"smooth"});};
    nav.appendChild(b);
  });
  const main = document.getElementById("lista");
  main.innerHTML = "";
  tiposComPeca.filter(t => filtro==="todos" || t.id===filtro).forEach(t=>{
    const itens = PECAS.filter(p=>p.tipo===t.id).sort((a,b)=>a.vendida-b.vendida);
    const sec = document.createElement("section");
    sec.innerHTML = `<h2><span class="dot" style="background:${t.cor}"></span>${t.nome}</h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    itens.forEach(p=>{
      const msg = encodeURIComponent(`Oi! Vi no catálogo da Caju e quero a peça ${p.cod} (${p.nome}) - ${brl(p.preco)}. Ainda está disponível?`);
      const c = document.createElement("div");
      c.className = "card" + (p.vendida ? " vendida" : "");
      c.innerHTML = `
        <div class="foto"><img src="${p.foto}" alt="${p.nome}" loading="lazy"><span class="cod">${p.cod}</span>${p.vendida?'<div class="faixa">VENDIDA</div>':''}</div>
        <div class="info">
          <div class="nome">${p.nome}</div>
          ${p.obs?`<div class="obs">${p.obs}</div>`:''}
          <div class="preco">${brl(p.preco)}</div>
          ${p.vendida?'<div class="esgot">Essa já tem dona!</div>':`<a class="btn" href="https://wa.me/${WHATS}?text=${msg}">Quero essa</a>`}
        </div>`;
      c.querySelector(".foto img").onclick=()=>abrirZoom(p);
      grid.appendChild(c);
    });
    main.appendChild(sec);
  });
}
const zoom=document.getElementById("zoom");
function abrirZoom(p){
  zoom.querySelector("img").src=p.foto; zoom.querySelector("img").alt=p.nome;
  zoom.querySelector(".zt").innerHTML=`<b>${p.nome}</b>${p.cod} · ${brl(p.preco)}${p.vendida?" · VENDIDA":""}`;
  zoom.classList.add("on"); document.body.style.overflow="hidden";
}
function fecharZoom(){zoom.classList.remove("on"); document.body.style.overflow="";}
zoom.onclick=e=>{ if(e.target.tagName!=="IMG") fecharZoom(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharZoom(); });
render();
</script>
</body>
</html>
